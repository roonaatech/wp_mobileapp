name: attendance_app
description: WorkPulse - Employee attendance, leave, and on-duty management.
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  geolocator: ^10.1.0
  device_info_plus: ^9.0.3
  package_info_plus: ^5.0.0
  provider: ^6.0.5
  google_fonts: ^6.0.0
  intl: ^0.18.1
  table_calendar: ^3.0.9
  url_launcher: ^6.2.0
  timezone: ^0.9.2
  camera: ^0.11.0+4
  permission_handler: ^11.3.1
  google_mlkit_face_detection: ^0.12.0
  tflite_flutter: ^0.12.1
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1 

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/models/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:             # <-- add this block at the bottom
  android: true
  ios: false
  image_path: "assets/abis_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/abis_icon.png"
